name: spanler-crm
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate the local .env file first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nocodb -d nocodb"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  nocodb:
    image: nocodb/nocodb:2026.10.1@sha256:8c2dd06896d95e750d55010e529972c22c1ee73b22dce321b1d2de2e7d5cd6ae
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NC_DB: "pg://db:5432?u=nocodb&p=${POSTGRES_PASSWORD:?Generate the local .env file first}&d=nocodb"
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET:?Generate the local .env file first}
      NC_PUBLIC_URL: ${CRM_PUBLIC_URL:?Set the actual HTTPS CRM URL}
      NC_DISABLE_TELE: "true"
    ports:
      - "127.0.0.1:${CRM_LOCAL_PORT:-8088}:8080"
    volumes:
      - nocodb_data:/usr/app/data
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      start_period: 90s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
volumes:
  postgres_data:
  nocodb_data:
